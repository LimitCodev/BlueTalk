# Límites de recursos (encargo del dueño, 2026-10-21 §0).
#
# La máquina tiene 16 hilos y 13 GB de RAM. En una sesión anterior se lanzó
# emulador + Gradle + daemon de Kotlin + adb a la vez: load average 68,
# swap lleno y el agente se congeló. Estos valores limitan Gradle a 4 hilos
# y 2 GB para que eso no se repita.
#
# Nada de `local[*]`, `-j$(nproc)` ni `make -j` sin número. Los comandos
# pesados van además envueltos en `systemd-run --user --scope -p
# CPUQuota=400% -p MemoryMax=6G nice -n 10 taskset -c 0-3` (ver
# `scripts/gradle-limite.sh`).
org.gradle.workers.max=4
org.gradle.parallel=false
org.gradle.daemon=true
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
kotlin.daemon.jvm.options=-Xmx1g
kotlin.compiler.execution.strategy=in-process

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
